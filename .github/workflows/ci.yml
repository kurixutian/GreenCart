name: GreenCart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - name: Start server and run Playwright E2E
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5174 >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test
          kill $SERVER_PID
